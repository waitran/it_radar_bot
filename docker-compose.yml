services:
  storage-init:
    build: .
    user: "0:0"
    command: ["python", "-m", "app.storage_init"]
    restart: "no"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    pids_limit: 32
    environment:
      TARGET_UID: ${BOT_UID:-10001}
      TARGET_GID: ${BOT_GID:-10001}
    volumes:
      - bot-data:/data
      - ${BACKUP_HOST_PATH:-./backups}:/backups
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  it-radar-bot:
    build: .
    container_name: it-radar-bot
    user: "${BOT_UID:-10001}:${BOT_GID:-10001}"
    depends_on:
      storage-init:
        condition: service_completed_successfully
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    restart: unless-stopped
    stop_grace_period: 90s
    mem_limit: ${BOT_MEMORY_LIMIT:-512m}
    cpus: ${BOT_CPU_LIMIT:-1.0}
    pids_limit: ${BOT_PIDS_LIMIT:-128}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Задайте TELEGRAM_BOT_TOKEN в .env или окружении}
      OWNER_TELEGRAM_ID: ${OWNER_TELEGRAM_ID:-0}
      MINIAPP_URL: ${MINIAPP_URL:-}
      MINIAPP_MENU_BUTTON: ${MINIAPP_MENU_BUTTON:-0}
      DB_PATH: /data/bot.db
      BACKUP_DIR: /backups
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      MIN_FREE_DISK_MB: ${MIN_FREE_DISK_MB:-1024}
      MAX_QUEUE_AGE_SECONDS: ${MAX_QUEUE_AGE_SECONDS:-86400}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-30}
      USER_AGENT: ${USER_AGENT:-Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36}
      ITEM_VERIFICATION_TTL_SECONDS: ${ITEM_VERIFICATION_TTL_SECONDS:-300}
      SOURCE_TIMEOUT_SECONDS: ${SOURCE_TIMEOUT_SECONDS:-600}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-3600}
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
    volumes:
      - bot-data:/data
      - ${BACKUP_HOST_PATH:-./backups}:/backups

volumes:
  bot-data:
